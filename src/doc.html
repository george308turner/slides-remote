<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="{{A}}favicon.png">
<link rel="apple-touch-icon" href="{{A}}icon.png">
<style>
{{STYLE}}
  /* Documents: help, privacy, terms */
  .doc { max-width: 760px; margin: 0 auto; padding: 48px 16px 72px; }
  @media (min-width: 720px) { .doc { padding: 64px 32px 96px; } }
  .doc h1 { font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.1; letter-spacing: -0.025em; margin: 0 0 16px; }
  .doc h2 { font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.015em; margin: 48px 0 12px; padding-top: 8px; }
  .doc h3 { font-size: 1.1875rem; line-height: 1.3; letter-spacing: -0.01em; margin: 32px 0 8px; }
  .doc h2, .doc h3 { scroll-margin-top: 72px; }
  .doc p, .doc li { color: var(--text); }
  .doc p { margin: 0 0 14px; }
  .doc ul, .doc ol { margin: 0 0 16px; padding-left: 1.4em; }
  .doc li { margin: 6px 0; }
  .doc li > ul, .doc li > ol { margin: 6px 0 0; }
  .doc em:only-child { color: var(--muted); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
  .doc code { font: 0.875em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg-alt); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  .doc a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .doc .back { display: inline-block; margin-bottom: 20px; font-size: 0.9375rem; text-decoration: none; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="{{HOME}}"><img src="{{A}}icon.png" alt="">Slides Remote</a>
    <div class="links">
      <a href="{{R}}support/" class="keep">Help</a>
      <a href="{{R}}privacy/">Privacy</a>
      <a href="{{R}}terms/">Terms</a>
    </div>
  </div>
</nav>

<main class="doc">
{{BACK}}
{{CONTENT}}
</main>

<footer>
  <div class="wrap">
    <span>© 2026 George Turner</span>
    <button class="theme-toggle" id="themeToggle" type="button"></button>
    <div class="links">
      <a href="{{HOME}}">Home</a>
      <a href="{{R}}support/">Help</a>
      <a href="{{R}}privacy/">Privacy Policy</a>
      <a href="{{R}}terms/">Terms of Use</a>
    </div>
  </div>
</footer>

<script>
(() => {
{{FILE_LINKS}}
  const nav = document.querySelector("nav");
  const onScroll = () => nav.classList.toggle("scrolled", scrollY > 4);
  addEventListener("scroll", onScroll, { passive: true }); onScroll();

  const here = location.pathname.replace(/index\.html$/, "");
  nav.querySelectorAll(".links a").forEach(a => {
    const target = new URL(a.href, location.href).pathname.replace(/index\.html$/, "");
    if (here.startsWith(target)) a.setAttribute("aria-current", "true");
  });

  const modes = ["auto", "light", "dark"], names = { auto: "Auto", light: "Light", dark: "Dark" };
  let mode = "auto";
  try { mode = localStorage.getItem("theme") || "auto"; } catch (e) {}
  const root = document.documentElement, toggle = document.getElementById("themeToggle");
  const apply = () => {
    if (mode === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
    toggle.textContent = "Theme: " + names[mode];
  };
  toggle.onclick = () => {
    mode = modes[(modes.indexOf(mode) + 1) % modes.length];
    try { localStorage.setItem("theme", mode); } catch (e) {}
    root.classList.add("theme-anim"); apply();
    setTimeout(() => root.classList.remove("theme-anim"), 400);
  };
  apply();
})();
</script>
</body>
</html>
